# The checks of DEVELOPMENT.md, run on every pull request and push to
# master. They run on macOS, where the app is developed and its UI tests
# are known to pass; the repository is public, so its minutes are free.
#
# One job, so that one cache keeps all it compiles: two jobs share
# setup-go's key, and the second to finish fails to save its own. The key
# follows this file too, as the steps decide what the cache holds.
name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch or pull request makes an older run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .github/workflows/ci.yml

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      # No file is built for one platform only (runtime.GOOS decides
      # instead), and only macOS is released, so Linux and Windows aren't
      # vetted: building their releases will check them.
      - name: go vet
        run: go vet ./...

      - name: mygo vet
        run: go tool mygo vet .

      - name: Strings in all languages
        run: go tool mygo i18n check

      # locales/catalog_gen.go is generated from locales/*.json, and go.sum
      # from go.mod: a change to one without the other leaves a diff.
      - name: Generated files up to date
        run: |
          go tool mygo generate
          go mod tidy
          git diff --exit-code

      # The tests, with the race detector: required for changes to
      # streaming or concurrency (DEVELOPMENT.md), and the same tests
      # without it would only repeat them.
      - name: go test -race
        run: go test -race ./...
